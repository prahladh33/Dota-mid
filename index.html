<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mid Lane Helper · 7.41f</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d1b16;--mu:#6b665b;--ln:#e0dbcf;--ac:#b4361f;--ok:#2f7a45;--wa:#a8680c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--card:#201d17;--tx:#f1ece0;--mu:#a29b8a;--ln:#363126;--ac:#ff7a59;--ok:#5fd28a;--wa:#f0b04a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:14px;max-width:520px;margin:auto}
h1{font-size:18px;margin:0 0 2px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
#clock{font:700 44px ui-monospace,monospace;text-align:center;letter-spacing:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
button{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font:inherit}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input{width:70px;text-align:center;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px;font:inherit}
.rn{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.rn:first-of-type{border-top:0}.rn b{font-size:15px}.t{font:600 18px ui-monospace,monospace}
.soon{color:var(--wa)}.now{color:var(--ok)}
label{display:flex;gap:8px;align-items:center;padding:6px 0}
input[type=checkbox]{width:20px;height:20px}
#verdict{font-weight:700;font-size:17px;padding:10px;border-radius:10px;margin-top:8px;background:var(--bg)}
ul{margin:6px 0;padding-left:18px}li{margin:4px 0}
</style></head><body>
<h1>Mid Lane Helper</h1><small>Built for 7.41f · tap Start when the horn blows (0:00 = game clock)</small>

<div class="card"><div id="clock">0:00</div>
<div class="row"><button class="p" id="go">Start</button><button id="rs">Reset</button>
<span><input id="mm" placeholder="mm" inputmode="numeric">:<input id="ss" placeholder="ss" inputmode="numeric"></span><button id="set">Sync</button></div>
<div class="row"><button id="m5">−5s</button><button id="p5">+5s</button></div></div>

<div class="card"><b>Runes</b><div id="runes"></div>
<small>Timings are in the RUNES list at the top of the script; edit if the map changes.</small></div>

<div class="card"><b>Rotate or stay?</b>
<label><input type="checkbox" id="c1">Rune secured</label>
<label><input type="checkbox" id="c2">Creep wave pushed into enemy tower</label>
<label><input type="checkbox" id="c3">Enemy mid is MIA</label>
<label><input type="checkbox" id="c4">Side lane is ahead / has a kill chance</label>
<label><input type="checkbox" id="c5">I have my key spell or boots</label>
<div id="verdict"></div></div>

<div class="card"><b>Ward checklist</b><ul id="wards"></ul></div>

<script>
// ---- edit timings here (seconds) ----
const RUNES=[
 {n:"Bounty",first:0,every:180,tip:"Grab the mid-side bounty if lane is safe"},
 {n:"Water",list:[120,240],tip:"Only 2:00 and 4:00 — contest it"},
 {n:"Power",first:360,every:120,tip:"Control it with a ward or a level lead"},
 {n:"Wisdom",first:420,every:420,tip:"Send a support or take it after a wave"}
];
const WARDS=[
 {from:0,to:240,t:"Early: ask support for a ward on the high-ground cliff beside your rune spot to see ganks coming."},
 {from:0,to:240,t:"Sentry or smoke counter: keep lane vision of the enemy jungle side of the river."},
 {from:240,to:600,t:"Before 6:00: ward the top-side power rune spot so you see the rune and rotations."},
 {from:360,to:1200,t:"After 6:00: re-ward the river both sides; old wards expire, check them."},
 {from:600,to:99999,t:"Midgame: deward enemy mid-jungle wards before you smoke or gank."}
];
let s=0,run=false,last=0;
const $=i=>document.getElementById(i);
const f=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
function next(r,t){
 if(r.list){for(const x of r.list)if(x>=t)return x;return null}
 if(t<=r.first)return r.first;
 return r.first+Math.ceil((t-r.first)/r.every)*r.every;
}
function draw(){
 $("clock").textContent=f(s);
 $("runes").innerHTML=RUNES.map(r=>{
  const n=next(r,s);
  if(n==null)return `<div class="rn"><div><b>${r.n}</b><br><small>No more spawns</small></div><div class="t mu">—</div></div>`;
  const d=n-s,c=d<=0?"now":d<=20?"soon":"";
  return `<div class="rn"><div><b>${r.n}</b> <small>at ${f(n)}</small><br><small>${r.tip}</small></div><div class="t ${c}">${d<=0?"NOW":f(d)}</div></div>`;
 }).join("");
 $("wards").innerHTML=WARDS.filter(w=>s>=w.from&&s<w.to).map(w=>`<li>${w.t}</li>`).join("")||"<li class='mu'>Start the clock.</li>";
 verdict();
}
function verdict(){
 const c=[1,2,3,4,5].map(i=>$("c"+i).checked);
 const [rune,push,mia,side,power]=c;
 let m,col="var(--ok)";
 if(s<360&&!(push&&side)){m="Stay — farm and hold the wave. Rotate only with a pushed wave and a kill chance.";col="var(--tx)"}
 else if(!push){m="Push the wave first, then go. Leaving a wave loses XP and tower pressure.";col="var(--wa)"}
 else if(mia&&!side){m="Enemy mid is MIA — stay safe, ward up, do not overextend.";col="var(--wa)"}
 else if(push&&side&&power&&rune){m="ROTATE now. Wave is pushed, rune is yours, side lane needs you.";}
 else if(push&&side){m="Rotate, but check smoke or ward first.";}
 else{m="Stay and farm. No clear reason to leave.";col="var(--tx)"}
 $("verdict").textContent=m;$("verdict").style.color=col;
}
setInterval(()=>{if(run){const n=performance.now();s+=(n-last)/1000;last=n;draw()}},250);
$("go").onclick=()=>{run=!run;last=performance.now();$("go").textContent=run?"Pause":"Start";draw()};
$("rs").onclick=()=>{s=0;run=false;$("go").textContent="Start";draw()};
$("set").onclick=()=>{const m=+$("mm").value||0,x=+$("ss").value||0;s=m*60+x;last=performance.now();draw()};
$("m5").onclick=()=>{s=Math.max(0,s-5);draw()};$("p5").onclick=()=>{s+=5;draw()};
document.querySelectorAll("input[type=checkbox]").forEach(e=>e.onchange=verdict);
draw();
</script></body></html>
